<text x="70.0" y="24.0" fill="#d1d4dc" text-anchor="start" font-size="15">BprFvgEA v9 - your rule: after T1, a rejection of at least 2 green candles (C1, C2) before the reversal (synthetic bars; MQL5 detector records, REVERSAL, v9 defaults)</text>
<text x="70.0" y="44.0" fill="#9598a1" text-anchor="start" font-size="12">The BPR forms on 13, price goes up and comes back: T1 on 17. C1 (18) and C2 (19) are green: the bullish rejection. Only then can a close below the T1 wick start the reversal.</text>
<text x="70.0" y="62.0" fill="#9598a1" text-anchor="start" font-size="12">1st close below the T1 wick on 22 (2 rejection candles before it), 2nd on 23: the sell limits at once. A new low moves them (24). The 50 % fills on 26; the target is hit on 27.</text>
