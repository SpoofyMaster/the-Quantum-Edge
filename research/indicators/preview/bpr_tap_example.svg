<text x="70.0" y="24.0" fill="#d1d4dc" text-anchor="start" font-size="15">BprFvgEA v8 - your example: the BPR is tapped later, from above (synthetic bars; MQL5 detector records, REVERSAL, v8 defaults)</text>
<text x="70.0" y="44.0" fill="#9598a1" text-anchor="start" font-size="12">The BPR forms on 13 and price goes up without touching it. It comes back and taps it from above on 17 (T1); 18 closes back above the BPR: the reaction (R).</text>
<text x="70.0" y="62.0" fill="#9598a1" text-anchor="start" font-size="12">The second close below the T1 wick (24) places the sell limits at once. Every new low moves them (25). The 50 % fills on 27; the target is hit on 28.</text>
